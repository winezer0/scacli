name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g., v1.0.0)
        required: true
        type: string
        default: v0.0.1

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: scacli-windows-amd64.zip
          - os: ubuntu-latest
            asset: scacli-linux-amd64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve Go modules
        run: go mod tidy

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -trimpath -ldflags "-s -w" -o bin/scacli.exe ./cmd/scacli
          Compress-Archive -LiteralPath bin/scacli.exe -DestinationPath scacli-windows-amd64.zip

      - name: Build Linux binary
        if: runner.os == 'Linux'
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w" -o bin/scacli ./cmd/scacli
          tar -C bin -czf scacli-linux-amd64.tar.gz scacli

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release if needed and upload builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "" \
              "${release_args[@]}"
          fi

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
